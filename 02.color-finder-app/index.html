<!DOCTYPE html>
<html lang="en">
<head>
  <title>Color Finder</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./img/favicon.ico">
  <!-- Bootstrap link -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top" data-bs-theme="dark">
      <div class="container-md">
        <!-- Logo -->
        <a class="navbar-brand me-5 fs-3" href="#top" translate="no">
          Color<span class="fw-medium">Finder</span>
        </a>

        <!-- Toggle Button -->
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNavCollapsible">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menu -->
        <div id="navbarNavCollapsible" class="collapse navbar-collapse">
          <ul class="navbar-nav ms-md-5 fs-5">
            <li class="nav-item me-4">
              <button class="nav-link active" data-mode="named" translate="no">Named Color</button>
            </li>
            <li class="nav-item me-4">
              <button class="nav-link" data-mode="rgb" translate="no">RGB Color</button>
            </li>
            <li class="nav-item me-4">
              <button class="nav-link" data-mode="hex" translate="no">HEX Color</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div class="vh-100 d-flex flex-column gap-4 align-items-center justify-content-center">
      <div class="px-5 py-3 bg-dark text-light d-flex flex-column gap-2 align-items-center justify-content-center">
        <h1 class="h4">Background color:</h1>
        <p id="color" class="h2" translate="no">white</p>
      </div>
      <button id="clickMeBtn" class="btn btn-lg btn-outline-dark rounded-pill">CLICK ME!</button>
    </div>
  </main>

  <!-- Bootstrap JS link -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <!-- jQuery link -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Custom JS -->
  <script src="./main.js"></script>
</body>
</html>
